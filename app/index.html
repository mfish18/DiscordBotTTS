<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FishBotTTS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">

  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.03.053a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
      </svg>
    </div>
    <div>
      <h1>FishBotTTS</h1>
      <div class="subtitle">Type here, speak in Discord</div>
    </div>
  </div>

  <div class="status-bar" role="status" aria-live="polite">
    <div class="dot active" id="dot"></div>
    <span id="status-text">Ready</span>
  </div>

  <div class="section">
    <label for="voiceSelect">Voice</label>
    <select id="voiceSelect">
      <option>Loading voices...</option>
    </select>
  </div>

  <div class="section">
    <label for="rate">Speed</label>
    <div class="slider-row">
      <input type="range" id="rate" min="0.5" max="2" step="0.05" value="1">
      <span class="slider-val" id="rate-val">1.00×</span>
    </div>
  </div>

  <div class="section">
    <label for="pitch">Pitch</label>
    <div class="slider-row">
      <input type="range" id="pitch" min="0.5" max="2" step="0.05" value="1">
      <span class="slider-val" id="pitch-val">1.00</span>
    </div>
  </div>

  <hr class="divider">

  <div class="section">
    <label for="msg">Message</label>
    <textarea id="msg" placeholder="Type your message..."></textarea>
    <div class="hint">Press <kbd>Ctrl</kbd>+<kbd>Enter</kbd> to speak</div>
  </div>

  <div class="row">
    <button class="btn-secondary" onclick="stopSpeaking()">Stop</button>
    <button class="btn-primary"   onclick="speak()">Speak</button>
  </div>

  <hr class="divider">

  <div class="webhook-header">
    <label style="margin: 0;">Bot Connection</label>
    <button class="webhook-toggle" onclick="toggleWebhook()">configure</button>
  </div>
  <div class="webhook-section" id="webhookSection">
    <input type="text" id="botPort" placeholder="3001" value="3001">
    <div class="hint">Port the bot is running on — default is 3001</div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
